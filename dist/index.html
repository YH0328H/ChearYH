<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <title>Cether · 会话</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#252b29;background:#f5f3ed;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0;min-width:300px;height:100vh;display:flex;flex-direction:column;background:#f5f3ed}
    header{height:62px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid #deded6;background:#fbfaf7}
    .mark{width:30px;height:30px;border-radius:8px;background:#427c68;color:white;display:grid;place-items:center;font-size:15px;font-weight:700}
    .identity{min-width:0;flex:1}.identity strong{display:block;font-size:14px;font-weight:650}.identity small{display:block;color:#7a827e;font-size:11px;margin-top:3px}
    select,button,textarea{font:inherit;color:inherit}select{max-width:130px;border:1px solid #d9ddd7;background:#fff;border-radius:6px;padding:7px 24px 7px 9px;font-size:12px}
    button{border:0;cursor:pointer}.icon-btn{width:32px;height:32px;background:transparent;border-radius:6px;color:#52625a;font-size:18px}.icon-btn:hover{background:#edf1ed}
    main{flex:1;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px}.empty{margin:auto;text-align:center;color:#78817c;font-size:13px}.empty b{display:block;color:#48534d;font-size:16px;margin-bottom:7px;font-weight:600}
    .message{max-width:min(86%,620px);display:flex;flex-direction:column;gap:5px}.message.user{align-self:flex-end;align-items:flex-end}.message.assistant{align-self:flex-start}
    .bubble{padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #e2e3dc;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#e1eee7;border-color:#d4e5db}.meta{font-size:10px;color:#858d88;padding:0 3px}
    footer{padding:10px 12px 14px;border-top:1px solid #deded6;background:#fbfaf7}.composer{display:flex;align-items:flex-end;gap:8px;background:white;border:1px solid #d9ddd7;border-radius:9px;padding:7px}.composer:focus-within{border-color:#83a996;box-shadow:0 0 0 2px #dce9e1}
    textarea{resize:none;flex:1;min-height:38px;max-height:110px;border:0;outline:0;padding:8px 4px;font-size:13px;line-height:1.45;background:transparent}.send{width:34px;height:34px;flex:none;background:#427c68;color:#fff;border-radius:7px;font-size:17px}.send:disabled{opacity:.45;cursor:wait}.status{min-height:15px;padding:5px 3px 0;font-size:10px;color:#7d8580}.status.error{color:#a54f42}
    @media(min-width:700px){body{max-width:720px;margin:0 auto;border-left:1px solid #e3e1d9;border-right:1px solid #e3e1d9}main{padding:24px 28px}footer{padding:12px 24px 18px}}
  </style>
</head>
<body>
  <header>
    <div class="mark">C</div>
    <div class="identity"><strong id="roleName">Cether</strong><small id="roleState">正在连接运行时</small></div>
    <select id="roles" aria-label="当前角色"></select>
    <button class="icon-btn" id="addRole" title="创建角色" aria-label="创建角色">＋</button>
  </header>
  <main id="messages" aria-live="polite"><div class="empty" id="empty"><b>开始一段对话</b>发出的消息会保存在当前角色的独立空间</div></main>
  <footer>
    <div class="composer"><textarea id="input" rows="1" placeholder="写一条消息…" aria-label="消息"></textarea><button class="send" id="send" aria-label="发送消息" title="发送">↑</button></div>
    <div class="status" id="status"></div>
  </footer>
  <script>
    const invoke = window.__TAURI__?.core?.invoke;
    const messages = document.querySelector('#messages');
    const input = document.querySelector('#input');
    const sendButton = document.querySelector('#send');
    const status = document.querySelector('#status');
    let busy = false;
    function showStatus(text='', error=false){status.textContent=text;status.classList.toggle('error',error)}
    function renderTurn(turn){
      document.querySelector('#empty')?.remove();
      const row=document.createElement('article');row.className='message '+(turn.role==='user'?'user':'assistant');
      const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=turn.text;
      const meta=document.createElement('div');meta.className='meta';meta.textContent=turn.role==='user'?'你':(turn.emotion||'回应');
      row.append(bubble,meta);messages.append(row);messages.scrollTop=messages.scrollHeight;
    }
    function applyState(data){
      const role=data.active_role;document.querySelector('#roleName').textContent=role?.name||'Cether';
      document.querySelector('#roleState').textContent=role?'当前角色':'未选择角色';
      const select=document.querySelector('#roles');select.replaceChildren();
      for(const item of data.roles||[]){const option=document.createElement('option');option.value=item.role_id;option.textContent=item.name;option.selected=item.role_id===role?.role_id;select.append(option)}
      messages.replaceChildren();for(const turn of data.history||[])renderTurn(turn);
    }
    async function bootstrap(){
      if(!invoke){showStatus('Tauri IPC 未连接',true);document.querySelector('#roleState').textContent='桌面运行时不可用';return}
      try{applyState(await invoke('app_bootstrap'))}catch(error){showStatus(String(error),true)}
    }
    async function send(){
      const text=input.value.trim();if(!text||busy)return;busy=true;sendButton.disabled=true;showStatus('正在回应…');
      renderTurn({role:'user',text});input.value='';input.style.height='auto';
      try{const result=await invoke('send_message',{text});renderTurn(result.turn);showStatus('已保存到当前角色')}
      catch(error){showStatus(String(error),true)}finally{busy=false;sendButton.disabled=false;input.focus()}
    }
    sendButton.addEventListener('click',send);
    input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}});
    input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px'});
    document.querySelector('#roles').addEventListener('change',async event=>{try{applyState(await invoke('switch_role',{roleId:event.target.value}));showStatus('已切换角色')}catch(error){showStatus(String(error),true);bootstrap()}});
    document.querySelector('#addRole').addEventListener('click',async()=>{const name=prompt('新角色名称');if(!name?.trim())return;try{applyState(await invoke('create_role',{name:name.trim()}));showStatus('角色已创建')}catch(error){showStatus(String(error),true)}});
    bootstrap();
  </script>
</body>
</html>
