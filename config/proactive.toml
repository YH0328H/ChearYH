# Proactive expression scheduler configuration

[scheduler]
check_interval = 300  # seconds between scheduler ticks
global_cooldown = 1800  # minimum seconds between any proactive expressions
frequency_limit = 10  # max proactive expressions per day

[triggers.idle]
enabled = true
threshold_seconds = 1800  # 30 minutes
cooldown = 3600
priority = 0.5

[triggers.stress]
enabled = true
keywords = ["bug", "error", "deadline", "failed", "exception", "crash"]
cooldown = 7200
priority = 0.8

[triggers.mindbox]
enabled = true
lookback_days = 14
cooldown = 86400
priority = 0.7

[triggers.weather]
enabled = false  # requires external weather API
cooldown = 43200
priority = 0.6

[gates]
require_awake = true
require_window_active = true
respect_silent_mode = true
